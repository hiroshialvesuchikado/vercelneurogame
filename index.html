<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NeuroGame
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         TELA DE CARREGAMENTO
         ================================================== -->

    <div
        id="telaCarregamento"
        class="tela-carregamento"
    >

        <div class="loading-container">

            <div class="loading-spinner">
            </div>

            <div class="loading-cerebro">
                🧠
            </div>

        </div>

        <p>
            Carregando NeuroGame...
        </p>

    </div>


    <!-- ==================================================
         MENU PRINCIPAL
         ================================================== -->

    <main class="menu-principal">

        <h1>
            NeuroGame
        </h1>

        <p>
            Escolha uma opção
        </p>


        <div class="opcoes-principais">


            <button
                class="opcao-principal"
                id="abrirAtlas"
                type="button"
            >

                <span class="icone-principal">
                    🧠
                </span>

                <strong>
                    ATLAS
                </strong>

                <small>
                    Explore e identifique estruturas anatômicas
                </small>

            </button>


            <button
                class="opcao-principal"
                id="abrirJogo"
                type="button"
            >

                <span class="icone-principal">
                    🎮
                </span>

                <strong>
                    JOGO
                </strong>

                <small>
                    Treine seus conhecimentos
                </small>

            </button>


        </div>

    </main>


    <!-- ==================================================
         ASSINATURA
         ================================================== -->

    <footer class="assinatura-site">

        Criado por: Hiroshi "Nagasa" Uchikado

    </footer>


    <!-- ==================================================
         NAVEGAÇÃO
         ================================================== -->

    <script>

        document
            .getElementById(
                "abrirAtlas"
            )
            .addEventListener(
                "click",
                function() {

                    window.location.href =
                        "atlas.html";

                }
            );


        document
            .getElementById(
                "abrirJogo"
            )
            .addEventListener(
                "click",
                function() {

                    window.location.href =
                        "jogo-menu.html";

                }
            );

    </script>


    <!-- ==================================================
         SCRIPT DO LOADING
         ================================================== -->

    <script>

        window.addEventListener(
            "load",

            function() {

                const tela =
                    document.getElementById(
                        "telaCarregamento"
                    );


                if (
                    !tela
                ) {

                    return;

                }


                tela.classList.add(
                    "oculta"
                );


                setTimeout(
                    function() {

                        tela.remove();

                    },
                    400
                );

            }
        );

    </script>


</body>

</html>
