<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NeuroGame — Atlas Interativo
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

<body>

     TELA DE CARREGAMENTO
     ================================================== -->

>

        </div>

    </p>

</div>


<main class="game">


    <!-- ==================================================

    <!-- ==================================================

        <div class="acoes-atlas">

    <!-- ==================================================
         MAPA ABERTO

<!-- ==================================================
     CARREGADOR DOS MAPAS
     ================================================== -->

<script src="Mapas/carregarMapas.js"></script>


<script>


// ======================================================
// 1. NOMES DOS TÓPICOS
// ======================================================

const TOPICOS_ATLAS = {

    medula:
        "Medula Espinhal",

    tronco:
        "Tronco Encefálico",

    cerebelo:
        "Cerebelo",

    diencefalo:
        "Diencéfalo",

    telencefalo:
        "Telencéfalo",

    vascularizacao:
        "Vascularização do SN",

    nucleosdabase:
        "Núcleos da Base e Regiões Capsulares"

};


// ======================================================
// 2. ELEMENTOS
// ======================================================

const telaTopicosAtlas =
    document.getElementById(
        "telaTopicosAtlas"
    );


const telaSelecaoAtlas =
    document.getElementById(
        "telaSelecaoAtlas"
    );


const telaMapaAtlas =
    document.getElementById(
        "telaMapaAtlas"
    );


const menuTopicosAtlas =
    document.getElementById(
        "menuTopicosAtlas"
    );


const menuMapasAtlas =
    document.getElementById(
        "menuMapasAtlas"
    );


const tituloTopicoAtlas =
    document.getElementById(
        "tituloTopicoAtlas"
    );


const tituloMapaAtlas =
    document.getElementById(
        "tituloMapaAtlas"
    );


const nomeEstruturaAtlas =
    document.getElementById(
        "nomeEstruturaAtlas"
    );


const imagemAtlas =
    document.getElementById(
        "imagemAnatomica"
    );


const svgAtlas =
    document.getElementById(
        "camadaHotspots"
    );


const botaoVoltarPrincipal =
    document.getElementById(
        "voltarPrincipal"
    );


const botaoVoltarTopicosAtlas =
    document.getElementById(
        "voltarTopicosAtlas"
    );


const botaoTrocarMapa =
    document.getElementById(
        "trocarMapaAtlas"
    );


// ======================================================
// 3. ESTADO
// ======================================================

let topicoAtlasSelecionado =
    null;


// ======================================================
// 4. CONFIGURAÇÕES VISUAIS
// ======================================================

const LARGURA_LINHA_NORMAL =
    10;


const LARGURA_LINHA_SELECIONADA =
    14;


const OPACIDADE_LINHA_NORMAL =
    0.75;


const OPACIDADE_LINHA_SELECIONADA =
    1;


const OPACIDADE_POLIGONO =
    0.30;


const OPACIDADE_CONTORNO_POLIGONO =
    0.85;


// ======================================================
// 5. CONFIGURAÇÃO DO TOQUE MOBILE
// ======================================================

const RAIO_TOQUE_LINHA_MOBILE =
    8;


// ======================================================
// 6. URL
// ======================================================

const parametrosAtlas =
    new URLSearchParams(
        window.location.search
    );


const idMapaSelecionado =
    parametrosAtlas.get(
        "mapa"
    );


// ======================================================
// 7. DESCOBRIR TÓPICO DO MAPA
// ======================================================

function obterTopicoMapaAtlas(
    mapa
) {

    if (
        mapa &&
        mapa.topico
    ) {

        return mapa.topico;

    }


    if (
        typeof window.definicoesMapas !==
        "undefined"
    ) {

        const definicao =
            window.definicoesMapas.find(
                function(item) {

                    return (
                        item.id ===
                        mapa.id
                    );

                }
            );


        if (
            definicao &&
            definicao.topico
        ) {

            return definicao.topico;

        }

    }


    return null;

}


// ======================================================
// 8. DESCOBRIR TÓPICO DA ESTRUTURA
// ======================================================

function obterTopicoEstruturaAtlas(
    estrutura
) {

    if (
        !estrutura ||
        !estrutura.id
    ) {

        return null;

    }


    const id =
        estrutura.id
            .toLowerCase();


    // ==================================================
    // TELENCÉFALO
    // ==================================================

    if (
        id.startsWith("giro_") ||
        id.startsWith("sulco_") ||
        id.startsWith("lobo_") ||
        id.startsWith("lobulo_") ||
        id.startsWith("nucleosdabase_") ||
        id.startsWith("trans_")
    ) {

        return "telencefalo";

    }


    // ==================================================
    // DIENCÉFALO
    // ==================================================

    if (
        id.startsWith("talamo_") ||
        id.startsWith("hipotalamo_") ||
        id.startsWith("epitalamo_") ||
        id.startsWith("subtalamo_")
    ) {

        return "diencefalo";

    }


    return null;

}


// ======================================================
// 9. VERIFICAR SE MAPA PERTENCE AO TÓPICO
// ======================================================

function mapaPertenceAoTopicoAtlas(
    mapa,
    topico
) {

    if (
        !mapa ||
        !topico
    ) {

        return false;

    }


    if (
        Array.isArray(
            mapa.estruturas
        )
    ) {

        const possui =
            mapa.estruturas.some(
                function(
                    estrutura
                ) {

                    return (
                        obterTopicoEstruturaAtlas(
                            estrutura
                        ) ===
                        topico
                    );

                }
            );


        if (
            possui
        ) {

            return true;

        }

    }


    return (
        obterTopicoMapaAtlas(
            mapa
        ) ===
        topico
    );

}


// ======================================================
// 10. DESCOBRIR TÓPICOS DISPONÍVEIS
// ======================================================

function obterTopicosDisponiveisAtlas() {

    const topicos =
        new Set();


    catalogoMapas.forEach(
        function(mapa) {

            const topicoMapa =
                obterTopicoMapaAtlas(
                    mapa
                );


            if (
                topicoMapa
            ) {

                topicos.add(
                    topicoMapa
                );

            }


            if (
                Array.isArray(
                    mapa.estruturas
                )
            ) {

                mapa.estruturas.forEach(
                    function(
                        estrutura
                    ) {

                        const topicoEstrutura =
                            obterTopicoEstruturaAtlas(
                                estrutura
                            );


                        if (
                            topicoEstrutura
                        ) {

                            topicos.add(
                                topicoEstrutura
                            );

                        }

                    }
                );

            }

        }
    );


    return Array.from(
        topicos
    );

}


// ======================================================
// 11. CRIAR CARDS DOS TÓPICOS
// ======================================================

function criarCardsTopicosAtlas() {

    menuTopicosAtlas.innerHTML =
        "";


    const topicos =
        obterTopicosDisponiveisAtlas();


    topicos.forEach(
        function(
            topico
        ) {

            const card =
                document.createElement(
                    "button"
                );


            card.type =
                "button";


            card.classList.add(
                "card-atlas"
            );


            const titulo =
                document.createElement(
                    "span"
                );


            titulo.textContent =
                TOPICOS_ATLAS[
                    topico
                ] ||
                topico;


            card.appendChild(
                titulo
            );


            card.addEventListener(
                "click",

                function() {

                    topicoAtlasSelecionado =
                        topico;


                    mostrarMapasDoTopico(
                        topico
                    );

                }
            );


            menuTopicosAtlas.appendChild(
                card
            );

        }
    );


    console.log(
        "Tópicos do Atlas:",
        topicos
    );

}


// ======================================================
// 12. MOSTRAR TÓPICOS
// ======================================================

function mostrarTopicosAtlas() {

    topicoAtlasSelecionado =
        null;


    telaTopicosAtlas.style.display =
        "block";


    telaSelecaoAtlas.style.display =
        "none";


    telaMapaAtlas.style.display =
        "none";


    criarCardsTopicosAtlas();

}


// ======================================================
// 13. MOSTRAR MAPAS DO TÓPICO
// ======================================================

function mostrarMapasDoTopico(
    topico
) {

    topicoAtlasSelecionado =
        topico;


    telaTopicosAtlas.style.display =
        "none";


    telaSelecaoAtlas.style.display =
        "block";


    telaMapaAtlas.style.display =
        "none";


    tituloTopicoAtlas.textContent =
        TOPICOS_ATLAS[
            topico
        ]
            ? `Escolha um mapa — ${TOPICOS_ATLAS[topico]}`
            : "Escolha um mapa";


    criarCardsAtlas(
        topico
    );

}


// ======================================================
// 14. CRIAR CARDS DOS MAPAS
// ======================================================

function criarCardsAtlas(
    topico
) {

    menuMapasAtlas.innerHTML =
        "";


    const mapasFiltrados =
        catalogoMapas.filter(
            function(
                mapa
            ) {

                return mapaPertenceAoTopicoAtlas(
                    mapa,
                    topico
                );

            }
        );


    if (
        mapasFiltrados.length ===
        0
    ) {

        const mensagem =
            document.createElement(
                "p"
            );


        mensagem.textContent =
            "Nenhum mapa disponível para este conteúdo.";


        menuMapasAtlas.appendChild(
            mensagem
        );


        return;

    }


    mapasFiltrados.forEach(
        function(mapa) {

            const card =
                document.createElement(
                    "button"
                );


            card.classList.add(
                "card-atlas"
            );


            card.type =
                "button";


            card.dataset.mapa =
                mapa.id;


            const imagemCard =
                document.createElement(
                    "img"
                );


            imagemCard.src =
                mapa.imagem;


            imagemCard.alt =
                mapa.titulo;


            const titulo =
                document.createElement(
                    "span"
                );


            titulo.textContent =
                mapa.titulo;


            card.appendChild(
                imagemCard
            );


            card.appendChild(
                titulo
            );


            card.addEventListener(
                "click",

                function() {

                    window.location.href =
                        `atlas.html?mapa=${encodeURIComponent(
                            mapa.id
                        )}&topico=${encodeURIComponent(
                            topico
                        )}`;

                }
            );


            menuMapasAtlas.appendChild(
                card
            );

        }
    );


    console.log(
        "Mapas do tópico:",
        topico,
        mapasFiltrados.length
    );

}


// ======================================================
// 15. ABRIR MAPA
// ======================================================

function abrirAtlas(
    idMapa
) {

    const mapa =
        catalogoMapas.find(
            function(item) {

                return (
                    item.id ===
                    idMapa
                );

            }
        );


    if (
        !mapa
    ) {

        telaTopicosAtlas.style.display =
            "none";


        telaSelecaoAtlas.style.display =
            "none";


        telaMapaAtlas.style.display =
            "block";


        tituloMapaAtlas.textContent =
            "Mapa não encontrado";


        esconderLoading();


        return;

    }


    telaTopicosAtlas.style.display =
        "none";


    telaSelecaoAtlas.style.display =
        "none";


    telaMapaAtlas.style.display =
        "block";


    tituloMapaAtlas.textContent =
        mapa.titulo;


    nomeEstruturaAtlas.textContent =
        "Nenhuma";


    carregarImagemAtlas(
        mapa
    );

}


// ======================================================
// 16. CARREGAR IMAGEM
// ======================================================

function carregarImagemAtlas(
    mapa
) {

    imagemAtlas.onload =
        function() {

            criarEstruturasAtlas(
                mapa
            );


            esconderLoading();

        };


    imagemAtlas.onerror =
        function() {

            tituloMapaAtlas.textContent =
                "Erro ao carregar imagem";


            console.error(
                "Imagem não encontrada:",
                mapa.imagem
            );


            esconderLoading();

        };


    imagemAtlas.src =
        mapa.imagem;

}


// ======================================================
// 17. GERAR COR
// ======================================================

function gerarCorAtlas(
    indice,
    total
) {

    const tonalidade =
        Math.round(
            (360 / total) *
            indice
        );


    return (
        `hsl(${tonalidade}, 75%, 50%)`
    );

}


// ======================================================
// 18. CONVERTER PONTO DA TELA PARA SVG
// ======================================================

function obterPontoSVGAtlas(
    evento
) {

    const matrizTela =
        svgAtlas.getScreenCTM();


    if (
        !matrizTela
    ) {

        return null;

    }


    const ponto =
        svgAtlas.createSVGPoint();


    ponto.x =
        evento.clientX;


    ponto.y =
        evento.clientY;


    return ponto.matrixTransform(
        matrizTela.inverse()
    );

}


// ======================================================
// 19. DISTÂNCIA ENTRE PONTO E SEGMENTO
// ======================================================

function distanciaPontoSegmento(
    px,
    py,
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;


    const dy =
        y2 - y1;


    if (
        dx === 0 &&
        dy === 0
    ) {

        return Math.hypot(
            px - x1,
            py - y1
        );

    }


    let t =
        (
            (
                px - x1
            ) * dx +

            (
                py - y1
            ) * dy
        )
        /
        (
            dx * dx +
            dy * dy
        );


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const pontoX =
        x1 +
        t * dx;


    const pontoY =
        y1 +
        t * dy;


    return Math.hypot(
        px - pontoX,
        py - pontoY
    );

}


// ======================================================
// 20. OBTER PONTOS DE UMA LINHA
// ======================================================

function obterPontosLinhaAtlas(
    elemento
) {

    const atributo =
        elemento.getAttribute(
            "points"
        );


    if (
        !atributo
    ) {

        return [];

    }


    const numeros =
        atributo
            .trim()
            .split(
                /[\s,]+/
            )
            .map(
                Number
            )
            .filter(
                function(valor) {

                    return Number.isFinite(
                        valor
                    );

                }
            );


    const pontos =
        [];


    for (
        let i = 0;
        i < numeros.length - 1;
        i += 2
    ) {

        pontos.push(
            {

                x:
                    numeros[i],

                y:
                    numeros[i + 1]

            }
        );

    }


    return pontos;

}


// ======================================================
// 21. DISTÂNCIA ATÉ UMA LINHA
// ======================================================

function distanciaAteLinhaAtlas(
    elemento,
    ponto
) {

    if (
        !ponto
    ) {

        return Infinity;

    }


    const listaPontos =
        obterPontosLinhaAtlas(
            elemento
        );


    if (
        listaPontos.length < 2
    ) {

        return Infinity;

    }


    let menorDistancia =
        Infinity;


    for (
        let i = 0;
        i < listaPontos.length - 1;
        i++
    ) {

        const atual =
            listaPontos[i];


        const proximo =
            listaPontos[
                i + 1
            ];


        const distancia =
            distanciaPontoSegmento(

                ponto.x,
                ponto.y,

                atual.x,
                atual.y,

                proximo.x,
                proximo.y

            );


        if (
            distancia <
            menorDistancia
        ) {

            menorDistancia =
                distancia;

        }

    }


    return menorDistancia;

}


// ======================================================
// 22. ENCONTRAR LINHA MAIS PRÓXIMA
// ======================================================

function encontrarLinhaMaisProximaAtlas(
    evento
) {

    const linhas =
        Array.from(
            svgAtlas.querySelectorAll(
                '.estrutura-atlas[data-tipo="linha"]'
            )
        );


    if (
        linhas.length ===
        0
    ) {

        return null;

    }


    const ponto =
        obterPontoSVGAtlas(
            evento
        );


    if (
        !ponto
    ) {

        return null;

    }


    const retanguloSVG =
        svgAtlas.getBoundingClientRect();


    const viewBox =
        svgAtlas.viewBox.baseVal;


    if (
        !retanguloSVG.width ||
        !viewBox.width
    ) {

        return null;

    }


    const escalaX =
        viewBox.width /
        retanguloSVG.width;


    const limite =
        RAIO_TOQUE_LINHA_MOBILE *
        escalaX;


    let melhorLinha =
        null;


    let melhorDistancia =
        Infinity;


    linhas.forEach(
        function(linha) {

            const distancia =
                distanciaAteLinhaAtlas(
                    linha,
                    ponto
                );


            if (
                distancia <
                melhorDistancia
            ) {

                melhorDistancia =
                    distancia;


                melhorLinha =
                    linha;

            }

        }
    );


    if (
        melhorDistancia <=
        limite
    ) {

        return melhorLinha;

    }


    return null;

}


// ======================================================
// 23. CRIAR ESTRUTURAS
// ======================================================

function criarEstruturasAtlas(
    mapa
) {

    svgAtlas.innerHTML =
        "";


    svgAtlas.setAttribute(
        "viewBox",
        `0 0 ${imagemAtlas.naturalWidth} ${imagemAtlas.naturalHeight}`
    );


    const totalEstruturas =
        mapa.estruturas.length;


    mapa.estruturas.forEach(
        function(
            estrutura,
            indice
        ) {

            let elemento;


            const cor =
                gerarCorAtlas(
                    indice,
                    totalEstruturas
                );


            // ==========================================
            // LINHA
            // ==========================================

            if (
                estrutura.tipo ===
                "linha"
            ) {

                elemento =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "polyline"
                    );


                elemento.classList.add(
                    "estrutura",
                    "estrutura-linha",
                    "estrutura-atlas"
                );


                elemento.style.fill =
                    "none";


                elemento.style.stroke =
                    cor;


                elemento.style.strokeOpacity =
                    OPACIDADE_LINHA_NORMAL;


                elemento.style.strokeWidth =
                    LARGURA_LINHA_NORMAL;


                elemento.style.strokeLinecap =
                    "round";


                elemento.style.strokeLinejoin =
                    "round";


                elemento.style.vectorEffect =
                    "non-scaling-stroke";

            }


            // ==========================================
            // POLÍGONO / ÁREA
            // ==========================================

            else {

                elemento =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "polygon"
                    );


                elemento.classList.add(
                    "estrutura",
                    "estrutura-area",
                    "estrutura-atlas"
                );


                elemento.style.fill =
                    cor;


                elemento.style.fillOpacity =
                    OPACIDADE_POLIGONO;


                elemento.style.stroke =
                    cor;


                elemento.style.strokeOpacity =
                    OPACIDADE_CONTORNO_POLIGONO;


                elemento.style.strokeWidth =
                    "3";

            }


            // ==========================================
            // COORDENADAS
            // ==========================================

            elemento.setAttribute(
                "points",
                estrutura.pontos
            );


            // ==========================================
            // DADOS
            // ==========================================

            elemento.dataset.id =
                estrutura.id;


            elemento.dataset.nome =
                estrutura.nome;


            elemento.dataset.tipo =
                estrutura.tipo ||
                "area";


            elemento.dataset.info =
                estrutura.info ||
                "";


            elemento.dataset.corOriginal =
                cor;


            svgAtlas.appendChild(
                elemento
            );

        }
    );


    console.log(
        "Estruturas criadas:",
        totalEstruturas
    );

}


// ======================================================
// 24. SELEÇÃO POR MOUSE / TOUCH
// ======================================================

svgAtlas.addEventListener(
    "pointerup",

    function(evento) {

        const alvoOriginal =
            evento.target.closest
                ? evento.target.closest(
                    ".estrutura-atlas"
                )
                : null;


        // ==============================================
        // MOUSE
        // ==============================================

        if (
            evento.pointerType ===
            "mouse"
        ) {

            if (
                alvoOriginal
            ) {

                selecionarEstruturaAtlas(
                    alvoOriginal
                );

            }


            return;

        }


        // ==============================================
        // TOUCH / CANETA
        // ==============================================

        evento.preventDefault();


        const linhaMaisProxima =
            encontrarLinhaMaisProximaAtlas(
                evento
            );


        if (
            linhaMaisProxima
        ) {

            selecionarEstruturaAtlas(
                linhaMaisProxima
            );


            return;

        }


        if (
            alvoOriginal &&
            alvoOriginal.dataset.tipo !==
            "linha"
        ) {

            selecionarEstruturaAtlas(
                alvoOriginal
            );

        }

    }
);


// ======================================================
// 25. SELECIONAR ESTRUTURA
// ======================================================

function selecionarEstruturaAtlas(
    elementoSelecionado
) {

    const estruturas =
        document.querySelectorAll(
            ".estrutura-atlas"
        );


    // ==================================================
    // RESTAURAR TODAS
    // ==================================================

    estruturas.forEach(
        function(elemento) {

            elemento.classList.remove(
                "selecionada-atlas"
            );


            elemento.style.stroke =
                elemento.dataset.corOriginal;


            if (
                elemento.dataset.tipo ===
                "linha"
            ) {

                elemento.style.strokeWidth =
                    LARGURA_LINHA_NORMAL;


                elemento.style.strokeOpacity =
                    OPACIDADE_LINHA_NORMAL;

            }


            else {

                elemento.style.strokeWidth =
                    "3";


                elemento.style.strokeOpacity =
                    OPACIDADE_CONTORNO_POLIGONO;


                elemento.style.fillOpacity =
                    OPACIDADE_POLIGONO;

            }

        }
    );


    // ==================================================
    // DESTACAR SELECIONADA
    // ==================================================

    elementoSelecionado.classList.add(
        "selecionada-atlas"
    );


    elementoSelecionado.style.stroke =
        "#ffffff";


    if (
        elementoSelecionado.dataset.tipo ===
        "linha"
    ) {

        elementoSelecionado.style.strokeWidth =
            LARGURA_LINHA_SELECIONADA;


        elementoSelecionado.style.strokeOpacity =
            OPACIDADE_LINHA_SELECIONADA;

    }


    else {

        elementoSelecionado.style.strokeWidth =
            "6";


        elementoSelecionado.style.strokeOpacity =
            "1";


        elementoSelecionado.style.fillOpacity =
            "0.40";

    }


    nomeEstruturaAtlas.textContent =
        elementoSelecionado.dataset.nome;

}

);


// ======================================================
// 28. ESCONDER TELA DE CARREGAMENTO
// ======================================================

function esconderLoading() {

    const tela =
        document.getElementById(
            "telaCarregamento"
        );


    if (
        !tela
    ) {

        return;

    }


    tela.classList.add(
        "oculta"
    );


    setTimeout(
        function() {

            tela.remove();

        },
        400
    );

}

                );
