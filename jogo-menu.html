<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NeuroGame
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ==================================================
     TELA DE CARREGAMENTO
     ================================================== -->

<div
    id="telaCarregamento"
    class="tela-carregamento"
>

    <div class="loading-container">

        <div class="loading-spinner">
        </div>

        <div class="loading-cerebro">
            🧠
        </div>

    </div>

    <p>
        Carregando NeuroGame...
    </p>

</div>


<main class="game">


    <!-- ==================================================
         TÍTULO
         ================================================== -->

    <h1>
        NeuroGame
    </h1>


    <h2 id="tituloMenuPrincipal">

    <!-- ==================================================
         TIPO DE ESTUDO

    <div

    >

            id="escolherPorEstrutura"

            🧠 Por estruturas

        <button
            id="escolherPorMapa"
            class="botao-categoria"
            type="button"
        >
            🗺️ Por mapa
        </button>


    </div>


    <!-- ==================================================
         ESTUDO POR ESTRUTURAS
         ================================================== -->

    <div
        id="menuCategorias"
        class="menu-modos"
    >


        <h2>
            Escolha a categoria
        </h2>


        <button
            class="botao-categoria"
            data-categoria="giro"
            type="button"
        >
            🧠 Giros
        </button>


        <button
            class="botao-categoria"
            data-categoria="sulco"
            type="button"
        >
            ➰ Sulcos
        </button>


        <button
            class="botao-categoria"
            data-categoria="lobo"
            type="button"
        >
            🧩 Lobos e Lóbulos
        </button>


        <button
            class="botao-categoria"
            data-categoria="nucleosdabase"
            type="button"
        >
            🧩 Núcleos da Base e Regiões Capsulares
        </button>


        <button
            id="voltarTipoEstrutura"

        >
            ← Voltar

    </div>


    <!-- ==================================================
         ESTUDO POR MAPA
         ================================================== -->

    <div
        id="menuMapas"
        class="menu-modos"
    >


        <h2>
            Escolha o mapa
        </h2>


        <div
            id="listaMapasJogo"
            class="menu-mapas"
        >
        </div>


        <button
            id="voltarTipoMapa"
            class="botao-acao"
            type="button"
        >
            ← Voltar
        </button>


    </div>


    <!-- ==================================================
         MODOS DE JOGO
         ================================================== -->

    <div
        id="menuModos"
        class="menu-modos"
    >


        <h2>
            Escolha o modo de jogo
        </h2>


        <button
            class="botao-modo"
            data-modo="clicar"
            type="button"
        >
            🎯 Clicar
        </button>


        <button
            class="botao-modo"
            data-modo="digitar"
            type="button"
        >
            ✍️ Digitar
        </button>


        <button
            id="voltarEscolha"
            class="botao-acao"
            type="button"
        >
            ← Voltar
        </button>


    </div>


    <!-- ==================================================
         BOTÃO MODO PROVA
         ================================================== -->

    <div
        id="menuProvaInicial"
        class="menu-categorias"
    >

        <button
            id="escolherModoProva"
            class="botao-categoria"
            type="button"
        >
            📝 Modo prova
        </button>

    </div>


    <!-- ==================================================
         CONFIGURAÇÃO DA PROVA
         ================================================== -->

    <div
        id="menuConfiguracaoProva"
        class="menu-modos"
    >


        <h2>
            Configurar prova
        </h2>


        <div class="campos-configuracao-prova">


            <div class="campo-prova">

                <label for="quantidadeProva">
                    Quantidade de questões
                </label>


                <input
                    id="quantidadeProva"
                    type="number"
                    min="1"
                    value="10"
                >
<div class="campos-configuracao-prova">


    
    <div class="campo-prova">

        <label for="tempoQuestaoProva">
            Tempo por questão
        </label>

        <select id="tempoQuestaoProva">

            <option value="0">
                Sem limite
            </option>

            <option value="15">
                15 segundos
            </option>

            <option value="30" selected>
                30 segundos
            </option>

            <option value="45">
                45 segundos
            </option>

            <option value="60">
                60 segundos
            </option>

            <option value="75">
                75 segundos
            </option>

            <option value="90">
                90 segundos
            </option>

            <option value="105">
                105 segundos
            </option>

            <option value="120">
                120 segundos
            </option>

        </select>

    </div>


</div>
            </div>


            <div class="campo-prova">

                <label for="modoRespostaProva">
                    Modo de resposta
                </label>


                <select id="modoRespostaProva">

                    <option value="clicar">
                        Clicar
                    </option>

                    <option value="digitar">
                        Digitar
                    </option>

                </select>

            </div>


        </div>


        <div class="acoes-configuracao-prova">

            <button
                id="iniciarProva"
                type="button"
            >
                Iniciar prova
            </button>


            <button
                id="voltarModoProva"
                class="botao-acao"
                type="button"
            >
                ← Voltar
            </button>

        </div>


    </div>


    <!-- ==================================================
         VOLTAR AO MENU PRINCIPAL
         ================================================== -->

    <div class="acoes-atlas">


        <button
            id="voltarPrincipalJogo"
            class="botao-acao"
            type="button"
        >
            ← Voltar ao menu principal
        </button>


    </div>


</main>


<!-- ==================================================
     RODAPÉ
     ================================================== -->

<footer class="assinatura-site">

    Criado por: Hiroshi "Nagasa" Uchikado

</footer>


<!-- ==================================================
     FUNÇÃO DO LOADING
     ================================================== -->

<script>

    function esconderLoadingMenu() {

        const tela =
            document.getElementById(
                "telaCarregamento"
            );


        if (
            !tela
        ) {

            return;

        }


        tela.classList.add(
            "oculta"
        );


        setTimeout(
            function() {

                tela.remove();

            },
            400
        );

    }

</script>


<!-- ==================================================
     CARREGADOR CENTRAL DOS MAPAS
     ================================================== -->

<script src="Mapas/carregarMapas.js"></script>


<!-- ==================================================
     INICIAR MENU SOMENTE DEPOIS DOS MAPAS
     ================================================== -->

<script>

    console.log(
        "⏳ Aguardando mapas..."
    );


    mapasProntos

        .then(
            function() {


                console.log(
                    "✅ Mapas prontos para o menu:",
                    catalogoMapas
                );


                const scriptMenu =
                    document.createElement(
                        "script"
                    );


                scriptMenu.src =
                    "js/menu.js";


                scriptMenu.onload =
                    function() {

                        console.log(
                            "✅ menu.js carregado com sucesso."
                        );


                        esconderLoadingMenu();

                    };


                scriptMenu.onerror =
                    function() {

                        console.error(
                            "❌ Erro ao carregar js/menu.js"
                        );


                        const titulo =
                            document.getElementById(
                                "tituloMenuPrincipal"
                            );


                        if (
                            titulo
                        ) {

                            titulo.textContent =
                                "Erro ao carregar o menu.";

                        }


                        esconderLoadingMenu();

                    };


                document.body.appendChild(
                    scriptMenu
                );

            }
        )


        .catch(
            function(
                erro
            ) {


                console.error(
                    "❌ Erro ao carregar os mapas:",
                    erro
                );


                const titulo =
                    document.getElementById(
                        "tituloMenuPrincipal"
                    );


                if (
                    titulo
                ) {

                    titulo.textContent =
                        "Erro ao carregar os mapas.";

                }


                esconderLoadingMenu();

            }
        );

</script>


<!-- ==================================================
     VOLTAR AO MENU PRINCIPAL
     ================================================== -->

<script>

    const botaoVoltarPrincipal =
        document.getElementById(
            "voltarPrincipalJogo"
        );


    if (
        botaoVoltarPrincipal
    ) {

        botaoVoltarPrincipal.addEventListener(
            "click",

            function() {

                window.location.href =
                    "index.html";

            }
        );

    }

</script>


</body>

</html>
